server:
  port: 8080

spring:
  application:
    name: cybersec-platform
  datasource:
    url: jdbc:mysql://localhost:3306/cybersec_platform?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: cybersec123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cybersec-platform
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: cybersec123

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cybersec.domain.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: false
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

milvus:
  host: localhost
  port: 19530

cybersec:
  kafka:
    topics:
      alert-events: cybersec.alert.events

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.cybersec: DEBUG
    org.springframework.kafka: INFO
